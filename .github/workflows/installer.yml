name: installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer template present
        id: template
        run: |
          if [ -f installer/TRNLizard_Installer.ghx ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "::warning::installer/TRNLizard_Installer.ghx missing: make it once with tools/make_installer.py in Grasshopper"; fi
      - name: Build installer
        if: steps.template.outputs.found == 'true'
        run: python tools/build_installer.py --out dist/TRNLizard_Installer.ghx
      - name: Attach to the release
        if: steps.template.outputs.found == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/TRNLizard_Installer.ghx --clobber
      - name: Keep as workflow artifact
        if: steps.template.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TRNLizard_Installer
          path: dist/TRNLizard_Installer.ghx
